[workspace]
members = [".", "crates/translator", "crates/python-bridge", "crates/ai-client"]
resolver = "2"

[package]
name = "ai_translator"
version = "0.4.1-1"
description = "An application to translate files using AI"
authors = ["Snootic"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1.43.0", features = ["process", "macros"] }
reqwest = "0.12.12"
ripunzip = "2.0.0"

# Your local crates
translator = { path = "crates/translator" }
python-bridge = { path = "crates/python-bridge" }
ai-client = { path = "crates/ai-client" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
